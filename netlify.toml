[build]
  publish = "dist"
  command = "npm run build"
  SECRETS_SCAN_OMIT_KEYS = ["VITE_TMDB_API_KEY"]

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "VITE_TMDB_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = "dist/**"
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
